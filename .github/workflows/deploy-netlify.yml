name: Deploy portfolio to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo 'ERROR: Netlify secrets missing.' >&2
            echo '' >&2
            echo 'Add these Actions secrets in GitHub:' >&2
            echo '  GitHub repo → Settings → Secrets and variables → Actions → New repository secret' >&2
            echo '  • NETLIFY_SITE_ID     = your Netlify Project ID (Site settings → General → Project ID)' >&2
            echo '  • NETLIFY_AUTH_TOKEN  = Netlify user token (User settings → Applications → Personal access tokens)' >&2
            echo '' >&2
            echo 'See README.md → "Setup: GitHub + Netlify secrets" for step-by-step instructions.' >&2
            exit 1
          fi
      - name: Prepare static site
        run: bash scripts/build.sh
      - name: Publish production deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.14.2 deploy --prod --dir=dist --no-build
